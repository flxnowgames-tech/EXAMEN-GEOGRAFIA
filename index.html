<html lang="es">
<head>

  <title>Geografía Mundial - Mapa Mudo Completo</title>
  
  <!-- Icono de bola del mundo para la pestaña -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌍</text></svg>">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { display: flex; flex-direction: column; height: 100vh; background-color: #f4f7f6; }

    header {
      background-color: #1a365d;
      color: white;
      padding: 12px 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      z-index: 1000;
    }

    .title-box h1 { font-size: 1.3rem; }

    .nav-tabs { display: flex; gap: 8px; }

    .tab-btn {
      background: #2b6cb0;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.3s;
    }

    .tab-btn.active, .tab-btn:hover {
      background: #3182ce;
      box-shadow: 0 0 5px rgba(255,255,255,0.4);
    }

    .controls-bar {
      background: #edf2f7;
      padding: 10px 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      border-bottom: 1px solid #cbd5e0;
    }

    .mode-group { display: flex; gap: 6px; }

    .btn-mode {
      padding: 6px 12px;
      border-radius: 5px;
      border: 1px solid #cbd5e0;
      background: white;
      cursor: pointer;
      font-weight: bold;
      color: #4a5568;
      transition: 0.2s;
    }

    .btn-mode.active-mode {
      background: #3182ce;
      color: white;
      border-color: #2b6cb0;
    }

    select {
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid #cbd5e0;
      font-size: 0.9rem;
      background: white;
      max-width: 250px;
    }

    #info-panel {
      background: #fffaf0;
      border: 1px solid #feebc8;
      padding: 6px 14px;
      border-radius: 6px;
      font-weight: bold;
      color: #744210;
      display: flex;
      gap: 15px;
      align-items: center;
    }

    #target-name {
      color: #c53030;
      text-decoration: underline;
      font-size: 1.05rem;
    }

    #map { flex: 1; width: 100%; z-index: 1; }

    .custom-popup { font-size: 0.95rem; text-align: center; }
    .custom-popup b { color: #2c5282; }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      font-size: 0.75rem;
      border-radius: 4px;
      background: #e2e8f0;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <header>
    <div class="title-box">
      <h1>🌍 Geografía Mundial (Mapa Mudo)</h1>
    </div>
    <div class="nav-tabs">
      <button class="tab-btn active" id="btn-politico" onclick="switchMap('politico')">Mapa Político</button>
      <button class="tab-btn" id="btn-fisico" onclick="switchMap('fisico')">Mapa Físico</button>
    </div>
  </header>

  <div class="controls-bar">
    <div class="mode-group">
      <button class="btn-mode active-mode" id="mode-estudio" onclick="setMode('estudio')">📚 Modo Estudio</button>
      <button class="btn-mode" id="mode-practica" onclick="setMode('practica')">🎯 Modo Práctica</button>
      <button class="btn-mode" id="mode-examen" onclick="setMode('examen')">📝 Modo Examen (30 Preguntas)</button>
    </div>

    <!-- Desplegable para volar a un elemento específico -->
    <label>
      <b>Ir a:</b>
      <select id="country-select" onchange="goToSelectedItem()">
        <option value="">-- Seleccionar Elemento --</option>
      </select>
    </label>

    <!-- Filtro de Categoría -->
    <label>
      <b>Filtrar:</b>
      <select id="filter-category" onchange="renderMarkers()">
        <option value="ALL">Mostrar Todo</option>
      </select>
    </label>

    <div id="info-panel" style="display: none;">
      <span id="panel-text">Busca: <strong id="target-name">---</strong></span>
      <span id="score-text">Puntos: <span id="score">0</span> | Racha: <span id="streak">0</span> 🔥</span>
    </div>
  </div>

    let currentMapType = 'politico';
    let currentMode = 'estudio';
    let markersGroup = [];
    let targetItem = null;

    let practiceScore = 0;
    let practiceStreak = 0;

    let examQuestions = [];
    let examIndex = 0;
    let examHits = 0;

    // Inicializar Mapa
    const map = L.map('map', {
      center: [20, 0],
      zoom: 2,
      minZoom: 2,
      maxZoom: 9
    });

    // MAPA ESRI 100% GRATUITO - SIN NOMBRES Y SIN API KEY
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri',
      maxZoom: 16
    }).addTo(map);

    function switchMap(type) {
      currentMapType = type;
      document.getElementById('btn-politico').classList.toggle('active', type === 'politico');
      document.getElementById('btn-fisico').classList.toggle('active', type === 'fisico');
      
      populateCountrySelect();
      populateCategoryFilter();
      setMode(currentMode);
    }

    function setMode(mode) {
      currentMode = mode;

      document.getElementById('mode-estudio').classList.toggle('active-mode', mode === 'estudio');
      document.getElementById('mode-practica').classList.toggle('active-mode', mode === 'practica');
      document.getElementById('mode-examen').classList.toggle('active-mode', mode === 'examen');

      const infoPanel = document.getElementById('info-panel');
      const scoreText = document.getElementById('score-text');

      if (mode === 'estudio') {
        infoPanel.style.display = 'none';
        renderMarkers();
      } else if (mode === 'practica') {
        infoPanel.style.display = 'flex';
        scoreText.style.display = 'inline';
        practiceScore = 0;
        practiceStreak = 0;
        updatePracticeScoreboard();
        nextPracticeQuestion();
      } else if (mode === 'examen') {
        infoPanel.style.display = 'flex';
        scoreText.style.display = 'none';
        startExam();
      }
    }

    function populateCountrySelect() {
      const select = document.getElementById('country-select');
      select.innerHTML = '<option value="">-- Seleccionar Elemento --</option>';
      
      const sortedItems = [...db[currentMapType]].sort((a, b) => a.name.localeCompare(b.name));
      sortedItems.forEach(item => {
        const opt = document.createElement('option');
        opt.value = item.name;
        opt.innerText = `${item.name} (${item.cat})`;
        select.appendChild(opt);
      });
    }

    function goToSelectedItem() {
      const selectedName = document.getElementById('country-select').value;
      if (!selectedName) return;

      const item = db[currentMapType].find(i => i.name === selectedName);
      if (item) {
        map.setView(item.coords, 5);
      }
    }

    function populateCategoryFilter() {
      const select = document.getElementById('filter-category');
      select.innerHTML = '<option value="ALL">Mostrar Todo</option>';
      
      const categories = [...new Set(db[currentMapType].map(item => item.cat))];
      categories.forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat;
        opt.innerText = cat;
        select.appendChild(opt);
      });
    }

    function renderMarkers() {
      markersGroup.forEach(m => map.removeLayer(m));
      markersGroup = [];

      const filterCat = document.getElementById('filter-category').value;
      const itemsToRender = db[currentMapType].filter(item => filterCat === 'ALL' || item.cat === filterCat);

      itemsToRender.forEach(item => {
        let color = '#3182ce';
        if (currentMapType === 'politico') {
          color = item.cat.includes('Ciudad') ? '#e53e3e' : '#2b6cb0';
        } else {
          if (['Río', 'Lago', 'Mar', 'Océano'].includes(item.cat)) color = '#3182ce';
          else if (['Pico', 'Cordillera'].includes(item.cat)) color = '#dd6b20';
          else color = '#38a169';
        }

        const circle = L.circleMarker(item.coords, {
          radius: item.cat.includes('Ciudad') || item.cat === 'Pico' ? 6 : 9,
          fillColor: color,
          color: '#ffffff',
          weight: 1.5,
          opacity: 1,
          fillOpacity: 0.85
        }).addTo(map);

        if (currentMode === 'estudio') {
          circle.bindPopup(`
            <div class="custom-popup">
              <b>${item.name}</b><br>
              <span class="badge">${item.cat}</span>
            </div>
          `);
        } else {
          circle.on('click', () => handleQuizAnswer(item));
        }

        markersGroup.push(circle);
      });
    }

    function updatePracticeScoreboard() {
      document.getElementById('score').innerText = practiceScore;
      document.getElementById('streak').innerText = practiceStreak;
    }

    function nextPracticeQuestion() {
      const activeList = db[currentMapType];
      targetItem = activeList[Math.floor(Math.random() * activeList.length)];
      document.getElementById('panel-text').innerHTML = `Busca: <strong id="target-name">${targetItem.name}</strong> (${targetItem.cat})`;
      renderMarkers();
    }

    function startExam() {
      const activeList = [...db[currentMapType]];
      const shuffled = activeList.sort(() => 0.5 - Math.random());
      examQuestions = shuffled.slice(0, Math.min(30, shuffled.length));
      examIndex = 0;
      examHits = 0;
      nextExamQuestion();
    }

    function nextExamQuestion() {
      if (examIndex >= examQuestions.length) {
        finishExam();
        return;
      }
      targetItem = examQuestions[examIndex];
      document.getElementById('panel-text').innerHTML = `Pregunta ${examIndex + 1} de ${examQuestions.length}: Ubica <strong id="target-name">${targetItem.name}</strong>`;
      renderMarkers();
    }

    function finishExam() {
      const total = examQuestions.length;
      const mark = ((examHits / total) * 10).toFixed(1);
      
      let message = `📝 EXAMEN FINALIZADO\n\n`;
      message += `- Preguntas respondidas: ${total}\n`;
      message += `- Aciertos totales: ${examHits}\n`;
      message += `- NOTA FINAL: ${mark} / 10\n\n`;

      if (mark >= 9) message += "🏆 ¡Excelente resultado!";
      else if (mark >= 7) message += "👍 ¡Muy bien!";
      else if (mark >= 5) message += "🙂 Aprobado.";
      else message += "⚠️ Debes repasar un poco más.";

      alert(message);
      setMode('estudio');
    }

    function handleQuizAnswer(clickedItem) {
      if (currentMode === 'practica') {
        if (clickedItem.name === targetItem.name) {
          practiceScore += 10;
          practiceStreak += 1;
          alert(`¡CORRECTO! 🎯 Has localizado ${clickedItem.name}`);
          updatePracticeScoreboard();
          nextPracticeQuestion();
        } else {
          practiceStreak = 0;
          updatePracticeScoreboard();
          alert(`❌ Incorrecto.\n\nHas pulsado en: ${clickedItem.name}\nBuscabas: ${targetItem.name}`);
        }
      } else if (currentMode === 'examen') {
        if (clickedItem.name === targetItem.name) {
          examHits++;
        }
        examIndex++;
        nextExamQuestion();
      }
    }

    // Inicialización
    populateCountrySelect();
    populateCategoryFilter();
    setMode('estudio');
  </script>
